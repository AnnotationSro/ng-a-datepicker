<div class="ng-date-popup--relative-wrapper">
  <div
    #popupRoot
    class="ng-date-popup position-{{ position }}"
    [style.left.px]="popupLeft"
    [style.top.px]="popupTop"
    role="dialog"
    aria-label="Choose date"
    *ngIf="isOpen"
  >
    <div class="ng-date-popup--header">
      <ng-container *ngIf="config.month">
        <button (click)="removeMonth()" type="button" class="ng-date-popup--prev" [disabled]="wouldBeOutOfBounds(false)">
          <span class="fas fa-chevron-left"></span>
        </button>
        <span class="ng-date-popup--month">{{ val | date: 'LLLL' }}</span>
        <button (click)="addMonth()" type="button" class="ng-date-popup--next" [disabled]="wouldBeOutOfBounds(true)">
          <span class="fas fa-chevron-right"></span>
        </button>
        &nbsp;
      </ng-container>

      <input
        type="number"
        class="ng-date-popup--year"
        *ngIf="config.year"
        [ngModel]="val.getFullYear()"
        (ngModelChange)="setYear($event)"
      />
    </div>

    <div class="ng-date-popup--date" *ngIf="config.date">
      <div class="ng-date-popup--days">
        <div *ngFor="let day of localizedDays">{{ day }}</div>
      </div>

      <div class="ng-date-popup--date-row" role="grid">
        <ng-container *ngFor="let day of days; let i = index">
          <div
            [id]="popupId + '-day-' + day.date.getTime()"
            class="ng-date-popup--date-day"
            role="gridcell"
            [attr.aria-selected]="compareDate(day.date)"
            [attr.aria-disabled]="isOutOfBounds(day.date)"
            [attr.aria-label]="day.date | date: 'fullDate'"
            [ngClass]="{
              'ng-date-popup--date-weekend': !day.currentMonth,
              'ng-date-popup--date-disabled': isOutOfBounds(day.date),
              'ng-date-popup--date-active': compareDate(day.date),
              'ng-date-popup--date-focused': isFocused(day.date)
            }"
            (click)="!isOutOfBounds(day.date) && setDate(day.date)"
          >
            {{ day.day }}
          </div>
          <div class="ng-date-popup--date-row-separator" *ngIf="day.dayOfWeek === 6"></div>
        </ng-container>
      </div>
    </div>

    <!-- TODO - mfilo - 27.01.2021 - toto je iba specialny pripad - datetime... spravit poriadne!!-->
    <hr *ngIf="config.minutes && config.year" />

    <div class="ng-date-popup--time" *ngIf="config.minutes || config.hours !== 'off' || config.seconds">
      <div class="ng-date-popup--time-row">
        <input
          type="number"
          class="form-control"
          *ngIf="config.hours === '24'"
          [ngModel]="val.getHours()"
          (ngModelChange)="setHours($event, ngModelHour)"
          #ngModelHour="ngModel"
          maxlength="2"
          min="-24"
          max="24"
        />
        <input
          type="number"
          class="form-control"
          *ngIf="config.hours === '12'"
          [ngModel]="displayHour"
          (ngModelChange)="setHours12($event, ngModelHour)"
          #ngModelHour="ngModel"
          maxlength="2"
          min="1"
          max="12"
        />
        &nbsp;:&nbsp;
        <input
          type="number"
          class="form-control"
          *ngIf="config.minutes"
          #inputElement
          [ngModel]="val.getMinutes().toString().padStart(2, '0')"
          (click)="inputElement.select()"
          (blur)="setMinutes(inputElement.value, ngModelMinute)"
          (change)="setMinutes(inputElement.value, ngModelMinute)"
          #ngModelMinute="ngModel"
          maxlength="2"
          min="-60"
          max="60"
          step="{{ timeStep }}"
        />
        <ng-container *ngIf="config.seconds">
          &nbsp;:&nbsp;
          <input
            type="number"
            class="form-control"
            #secondsInputElement
            [ngModel]="val.getSeconds().toString().padStart(2, '0')"
            (click)="secondsInputElement.select()"
            (blur)="setSeconds(secondsInputElement.value, ngModelSecond)"
            (change)="setSeconds(secondsInputElement.value, ngModelSecond)"
            #ngModelSecond="ngModel"
            maxlength="2"
            min="0"
            max="59"
          />
        </ng-container>
        <div class="ng-date-popup--dayperiod" *ngIf="config.dayPeriod">
          <button
            type="button"
            class="ng-date-popup--dayperiod-btn"
            [class.ng-date-popup--dayperiod-btn-active]="!isPm"
            (click)="setDayPeriod('AM')"
          >
            AM
          </button>
          <button
            type="button"
            class="ng-date-popup--dayperiod-btn"
            [class.ng-date-popup--dayperiod-btn-active]="isPm"
            (click)="setDayPeriod('PM')"
          >
            PM
          </button>
        </div>
      </div>
    </div>

    <div class="ng-date-popup--footer" *ngIf="showActionButtons">
      <button type="button" class="ng-date-popup--btn ng-date-popup--btn-close" (click)="closePopup()">Close</button>
      <button type="button" class="ng-date-popup--btn ng-date-popup--btn-apply" (click)="apply()">Apply</button>
    </div>
  </div>
</div>
